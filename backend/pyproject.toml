[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gcs-backend"
version = "0.1.0"
description = "Centralized Ground Control System Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=14.0",
    "redis>=5.2.0",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.2.0",
    "sqlalchemy>=2.0.0",
    "influxdb-client>=1.45.0",
    "minio>=7.2.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.12",
    "structlog>=24.4.0",
    "aiormq>=6.8.0",
    "aio-pika>=9.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]